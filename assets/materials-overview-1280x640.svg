<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"><title>Retaining Wall Calc material toolkit</title><desc>Hypothetical 24 foot example. Grid has 18 units across and 6 courses: 108 net units. Five courses are visible and one selected course is buried. A selected 10 percent allowance rounds to 119 order units. This is not an installation specification.</desc><rect width="1280" height="640" fill="#173f38"/><rect x="52.099999999999994" y="80.1" width="26.599999999999998" height="15.2" rx="2" fill="#d9ee91"/><rect x="82.5" y="80.1" width="26.599999999999998" height="15.2" rx="2" fill="#d9ee91"/><rect x="59.7" y="61.1" width="26.599999999999998" height="15.2" rx="2" fill="#d9ee91"/><rect x="90.1" y="61.1" width="19.0" height="15.2" rx="2" fill="#d9ee91"/><rect x="73.0" y="42.099999999999994" width="36.1" height="15.2" rx="2" fill="#d9ee91"/><text x="124" y="65" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f7f9ee">Retaining Wall Calc</text><text x="54" y="150" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="45" font-weight="700" fill="#f7f9ee">Retaining wall</text><text x="54" y="205" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="45" font-weight="700" fill="#f7f9ee">materials</text><text x="54" y="298" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="700" fill="#d9ee91">108 net → 119 order</text><text x="54" y="353" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#f7f9ee">18 per course × 6 courses = 108</text><text x="54" y="389" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#a6beb4">Selected 10% allowance, then round up</text><text x="54" y="470" dominant-baseline="text-before-edge" font-family="DejaVu Sans,s